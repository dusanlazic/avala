[project]
name = "avala-server"
version = "0.1.0"
description = "Avala server for flag submission, flag ID fetching and client synchronization"
authors = [
    {name = "Dušan Lazić", email = "lazicdusan@protonmail.com"}
]
readme = "README.md"
packages = [
    {include = "avala"}
]
include = [
    "avala/static/*",
    "avala/initialization/files/flag_ids.py",
    "avala/initialization/files/submitter.py",
    "avala/initialization/files/compose.yaml",
    "avala/initialization/files/server.yaml",
]
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.5.1",
    "apscheduler>=3.11.0",
    "asyncpg>=0.30.0",
    "avala-shared",
    "broadcaster>=0.3.1",
    "click>=8.1.7",
    "fastapi[standard]>=0.115.5",
    "httptools>=0.6.4",
    "pika>=1.3.2",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.6.1",
    "pyparsing>=3.2.0",
    "requests>=2.32.3",
    "sqlalchemy[mypy]>=2.0.36",
    "uvicorn>=0.32.1",
    "uvloop>=0.21.0",
]

[tool.uv.sources]
avala-shared = { path = "../shared", editable = true }

[tool.mypy]
ignore_missing_imports = true
exclude = ["avala/initialization/files"]
plugins = "sqlalchemy.ext.mypy.plugin"

[tool.ruff.lint]
select = ["I"]

[tool.isort]
known_first_party = ["avala"]
include_trailing_comma = true
