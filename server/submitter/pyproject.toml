[project]
name = "submitter"
version = "0.1.0"
description = "Flag submitter component of Avala server"
authors = [{ name = "Dušan Lazić", email = "lazicdusan@protonmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5.5",
    "asyncpg>=0.30.0",
    "avala-common",
    "pip>=25.2",
    "sqlalchemy>=2.0.39",
]

[project.scripts]
submitter = "submitter:main.main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython>=9.0.2",
    "mypy>=1.15.0",
    "pika>=1.3.2",
    "pika-stubs>=0.1.3",
    "ruff>=0.11.2",
]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I", "W", "E", "F", "C", "B9"]

[tool.isort]
known_first_party = ["avala"]

[tool.uv.sources]
avala-common = { path = "common" }
