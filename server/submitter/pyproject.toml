[project]
name = "avala-submitter"
version = "0.1.0"
description = "Flag submitter component of Avala server"
authors = [
    {name = "Dušan Lazić", email = "lazicdusan@protonmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "pika>=1.3.2",
    "pydantic-settings[yaml]>=2.7.1",
]

[dependency-groups]
dev = [
    "ipython>=8.32.0",
    "mypy>=1.15.0",
    "pika-stubs>=0.1.3",
    "ruff>=0.9.6",
]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I", "W", "E", "F", "C", "B9"]

[tool.isort]
known_first_party = ["avala"]
